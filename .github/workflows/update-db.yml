name: Update signature database

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 */2 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify upstream databases
        run: |
          chmod +x tools/*.sh
          tools/fetch_upstream_db.sh out

      - name: Compare with latest release
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo "")
          new=$(python3 -c "import json;print(json.load(open('out/manifest.json'))['version'])")
          if [ -n "$latest" ]; then
            gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir prev || true
          fi
          if [ -f prev/manifest.json ] && python3 - <<'PY'
          import json,sys
          a=json.load(open('prev/manifest.json'));b=json.load(open('out/manifest.json'))
          sys.exit(0 if {f['name']:f['sha256'] for f in a['files']}=={f['name']:f['sha256'] for f in b['files']} else 1)
          PY
          then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes since $latest"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "tag=$new" >> "$GITHUB_OUTPUT"; fi

      - name: Publish release
        id: pub
        if: steps.cmp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.cmp.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          gen=$(python3 -c "import json;print(json.load(open('out/manifest.json'))['generated_at'])")
          gh release create "$tag" out/manifest.json out/sig-md5.bin out/sig-sha1.bin out/sig-sha256.bin \
            --repo "$GITHUB_REPOSITORY" --title "Signatures $tag" \
            --notes "Signature database $tag (data generated $gen). Upstream GPG signatures verified. Older releases are kept as history." --latest
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "gen=$gen" >> "$GITHUB_OUTPUT"

      # Releases are never deleted: together with HISTORY.md they are the dated history of all databases.
      - name: Add to HISTORY.md
        if: steps.cmp.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase
          python3 tools/history_add.py signatures "${{ steps.pub.outputs.tag }}" "${{ steps.pub.outputs.tag }}" "3 Bloom filters" "${{ steps.pub.outputs.gen }}"
          git add HISTORY.md && git commit -q -m "History: signatures ${{ steps.pub.outputs.tag }}" && git push
