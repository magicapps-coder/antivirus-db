name: Build signature database

# Builds the signature database ourselves every day from the same open sources the Hypatia generator uses
# (ClamAV, ESET, Signature-Base, ThreatView, ThreatFox, MalwareBazaar, stalkerware indicators, Sanesecurity, Avast
# COVID-19 IOC, targeted threats), with the open-source generator (AGPL, run here only; nothing of it ships in the app).
# Replaces mirroring the upstream files, which stopped updating on 2026-09-27.
#
# A source that fails is skipped (warning in the summary); the build fails, and nothing is published, if the result
# looks broken (too few signatures, a filter over capacity, or much smaller than the last release).
# abuse.ch (ThreatFox, MalwareBazaar) needs a free Auth-Key in the repository secret ABUSECH_AUTH_KEY.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (off = build and keep the files as a workflow artifact only)"
        type: boolean
        default: false
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

env:
  GENERATOR_REPO: https://github.com/MaintainTeam/HypatiaDatabases.git
  GENERATOR_COMMIT: 3c35f52e1a847caed46d8e1ad34968bfa3c8b10a
  MIN_TOTAL: "1000000"        # signatures; the last upstream database had ~1.7M
  MIN_RATIO_VS_LAST: "0.8"    # refuse to publish a database that lost more than 20% of the last release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      W: /tmp/hdb          # outside the workspace: the ClamAV action cleans it
      GEN: /tmp/hdb-gen
      ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
    steps:
      # First: this action leaves the workspace empty, so the checkout comes after it.
      - name: Start ClamAV
        uses: toblux/start-clamd-github-action@v0.2.1
        with:
          db_main: true
          db_daily: true

      - uses: actions/checkout@v4

      - name: Generator and dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq maven unzip dos2unix rsync
          git clone -q "$GENERATOR_REPO" "$GEN" && git -C "$GEN" checkout -q "$GENERATOR_COMMIT"
          mkdir -p "$W/raw" "$W/exclusions" "$W/various"
          cp "$GEN"/static/* "$W/raw/"     # self-test canary hashes

      - name: Source - ClamAV
        run: |
          mkdir /tmp/cl && cd /tmp/cl
          cp /var/lib/clamav/main.c*d /var/lib/clamav/daily.c*d .
          sigtool -u main.c*d; sigtool -u daily.c*d
          mv *.fp* "$W/exclusions/" || true
          mv *.hsb *.hdb *.hdu *.hsu "$W/raw/" 2>/dev/null || true
          ls "$W/raw" | grep -q '\.hdb$' || { echo "ClamAV produced no hash databases" >&2; exit 1; }

      - name: Source - ESET
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/eset/malware-ioc "$W/various/eset"
          for t in md5 sha1 sha256; do
            find "$W/various/eset" -maxdepth 2 -name "samples.$t" -exec cat {} + | dos2unix > "$W/raw/eset.$t"
          done

      - name: Source - Signature-Base
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/Neo23x0/signature-base/master/iocs/hash-iocs.txt -o "$W/raw/signature-base.loki"

      - name: Source - ThreatView
        continue-on-error: true
        run: |
          curl -fsSL "https://threatview.io/Downloads/MD5-HASH-ALL.txt" | sed 's/MD5 of //' | sort -u > "$W/raw/threatview.md5"
          curl -fsSL "https://threatview.io/Downloads/SHA-HASH-FEED.txt" | sort -u > "$W/raw/threatview.sha1"

      - name: Source - MalwareBazaar (abuse.ch)
        continue-on-error: true
        run: |
          test -n "$ABUSECH_AUTH_KEY" || { echo "::warning::ABUSECH_AUTH_KEY not set, MalwareBazaar skipped"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 20 "https://mb-api.abuse.ch/v2/files/exports/$ABUSECH_AUTH_KEY/sha256_full.txt.zip" -o "$W/various/mb.zip"
          ls -la "$W/various/mb.zip"; unzip -l "$W/various/mb.zip"
          unzip -p "$W/various/mb.zip" | tr -d '\r' | grep -oE '^[0-9a-f]{64}' > "$W/raw/malware_bazaar.sha256"
          wc -l "$W/raw/malware_bazaar.sha256"

      - name: Source - ThreatFox (abuse.ch)
        continue-on-error: true
        run: |
          test -n "$ABUSECH_AUTH_KEY" || { echo "::warning::ABUSECH_AUTH_KEY not set, ThreatFox skipped"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 20 "https://threatfox-api.abuse.ch/v2/files/exports/$ABUSECH_AUTH_KEY/sha256_full.csv.zip" -o "$W/various/tf.zip"
          unzip -p "$W/various/tf.zip" | grep -oE '"[0-9a-f]{64}"' | tr -d '"' | sort -u > "$W/raw/threatfox.sha256"
          wc -l "$W/raw/threatfox.sha256"

      - name: Source - Stalkerware indicators
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/samples.csv \
            | tail -n +2 | awk -F, '$1!="" && $5!="" {print $1":0:"$5}' > "$W/raw/stalkerware.hsb"

      - name: Source - Sanesecurity
        continue-on-error: true
        run: |
          mkdir -p "$W/various/ss" && cd "$W/various/ss"
          rsync -a rsync://rsync.sanesecurity.net/sanesecurity .
          for f in *.hsb *.hdb; do [ -f "$f" ] && sort -u "$f" > "$W/raw/sanesecurity-$f"; done
          rm -f "$W/raw/sanesecurity-crdfam.clamav.hdb" "$W/raw/sanesecurity-doppelstern.hdb" "$W/raw/sanesecurity-malware.expert.hdb"

      - name: Source - Avast COVID-19 IOC
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/avast/covid-19-ioc.git "$W/various/avast"
          tail -q -n +2 "$W"/various/avast/datasets/android/*.csv | cut -d, -f1 | tr -d ' ' | sort -u > "$W/raw/avast-covid19.sha256"

      - name: Source - Targeted threats
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/botherder/targetedthreats.git "$W/various/tt"
          python3 - "$W" <<'PY'
          import csv,sys
          w=sys.argv[1]
          md5=open(f"{w}/raw/targetedthreats.hdb","w"); sha=open(f"{w}/raw/targetedthreats.hsb","w")
          for r in list(csv.reader(open(f"{w}/various/tt/samples.csv")))[1:]:
              if len(r)<4: continue
              d="-".join(x for x in (r[3].strip(),r[2].strip()) if x) or "targetedthreats"
              if r[0].strip(): md5.write(f"{r[0].strip()}:0:{d}\n")
              if r[1].strip(): sha.write(f"{r[1].strip()}:0:{d}\n")
          PY

      - name: Sources summary
        if: always()
        run: |
          { echo "### Sources (lines per file)"; echo '```'; wc -l "$W"/raw/* 2>/dev/null | sort -n; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Bloom filters
        run: |
          : > "$W/domains.txt"   # domain filter not used by the app
          cd "$GEN"
          mvn -q -B --no-transfer-progress clean compile exec:java \
            -Dexec.mainClass="org.maintainteam.hypatiadatabases.App" -Dexec.args="$W/raw/ $W/domains.txt" | tee "$W/report.txt"

      - name: Check the result
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$W/report.txt" <<'PY' >> "$GITHUB_OUTPUT"
          import re,sys,os
          t=open(sys.argv[1]).read()
          a=dict((k,int(v)) for k,v in re.findall(r'(md5|sha1|sha256): (\d+)', re.search(r'Added count:(.*)',t).group(1)))
          fill=[float(v) for k,v in re.findall(r'(md5|sha1|sha256): ([\d.E-]+)%', re.search(r'Fill amount:(.*)',t).group(1))]
          total=sum(a.values())
          print(f"total={total}")
          bad=[]
          if total < int(os.environ["MIN_TOTAL"]): bad.append(f"only {total} signatures")
          if max(fill) > 100: bad.append(f"filter over capacity: {fill}")
          # MalwareBazaar is the largest SHA-256 source: without it the database is poorer than the last one.
          mb=os.path.join(os.path.dirname(sys.argv[1]),'raw','malware_bazaar.sha256')
          if not os.path.exists(mb) or os.path.getsize(mb) < 1_000_000: bad.append('MalwareBazaar missing (ABUSECH_AUTH_KEY?)')
          if bad: print("::error::"+"; ".join(bad), file=sys.stderr); sys.exit(1)
          PY
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[]|select(.name=="manifest.json").url' 2>/dev/null || true)
          if [ -n "$last" ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir prev || true
            prev=$(python3 -c "import json;print(json.load(open('prev/manifest.json')).get('signature_count',0))" 2>/dev/null || echo 0)
            total=$(grep '^total=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            python3 -c "import sys;p=$prev;t=$total;r=float('$MIN_RATIO_VS_LAST');sys.exit(0 if p==0 or t>=p*r else 1)" \
              || { echo "::error::$total signatures vs $prev in the last release"; exit 1; }
          fi
          { echo "### Signature database"; echo '```'; grep -E 'Added count|Fill amount|Expected false|exclusions' "$W/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          mkdir -p out
          cp "$W/raw/hypatia-md5-bloom.bin" out/sig-md5.bin
          cp "$W/raw/hypatia-sha1-bloom.bin" out/sig-sha1.bin
          cp "$W/raw/hypatia-sha256-bloom.bin" out/sig-sha256.bin
          gen=$(date -u +%Y-%m-%dT%H:%M:%SZ); ver=$(date -u +%Y.%m.%d)
          tools/make_manifest.sh out "$ver" "$gen" >/dev/null
          python3 - <<PY
          import json; p='out/manifest.json'; m=json.load(open(p)); m['signature_count']=${{ steps.check.outputs.total }}
          json.dump(m,open(p,'w'),indent=2)
          PY
          cat out/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: signature-database
          path: out/
          retention-days: 7

      - name: Publish release
        id: pub
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c "import json;print(json.load(open('out/manifest.json'))['version'])")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          gh release create "$tag" out/manifest.json out/sig-md5.bin out/sig-sha1.bin out/sig-sha256.bin \
            --repo "$GITHUB_REPOSITORY" --title "Signatures $tag" \
            --notes "Signature database $tag, ${{ steps.check.outputs.total }} signatures, built by the Build signature database workflow. Older releases are kept as history." --latest
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Add to HISTORY.md
        if: steps.pub.outputs.tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase
          python3 tools/history_add.py signatures "${{ steps.pub.outputs.tag }}" "${{ steps.pub.outputs.tag }}" "3 Bloom filters" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git add HISTORY.md && git commit -q -m "History: signatures ${{ steps.pub.outputs.tag }}" && git push
