name: Backfill history (one-off)

# Publishes every older link database (from the previous repository's git history and from this one) as a dated
# release links-<version>, and fills HISTORY.md, including the existing signature release. Safe to re-run: existing
# releases and rows are skipped. Delete this workflow after it ran.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect old versions
        run: |
          git clone -q https://github.com/VictorJava/antivirus-db.git /tmp/old
          rm -f /tmp/list.txt
          for repo in /tmp/old .; do
            git -C "$repo" log --reverse --format='%H %cI' -- links/links-manifest.json | while read -r sha date; do
              echo "$repo $sha $date" >> /tmp/list.txt
            done
          done
          cat /tmp/list.txt
      - name: Publish releases and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sort -k3 /tmp/list.txt | while read -r repo sha date; do
            d=$(mktemp -d)
            for f in link-domains.bin link-urls.bin links-manifest.json; do git -C "$repo" show "$sha:links/$f" > "$d/$f"; done
            v=$(python3 -c "import json;print(json.load(open('$d/links-manifest.json'))['version'])")
            gen=$(python3 -c "import json;print(json.load(open('$d/links-manifest.json'))['generated_at'])")
            n=$(python3 -c "import json;m=json.load(open('$d/links-manifest.json'));print(f\"{m['domain_count']:,} sites, {m['url_count']:,} links\")")
            tag="links-$v"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" "$d/link-domains.bin" "$d/link-urls.bin" "$d/links-manifest.json" \
                --title "Links $v" --notes "Link database $v (generated $gen): $n." --latest=false
            fi
            HISTORY_DATE=$(date -u -d "$gen" +"%Y-%m-%d %H:%M") python3 tools/history_add.py links "$v" "$tag" "$n" "$gen"
          done
          # The signature release already exists; add it to the history in date order.
          for tag in $(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -v '^links-' | sort); do
            gh release download "$tag" --pattern manifest.json --dir "/tmp/s-$tag" --clobber
            gen=$(python3 -c "import json;print(json.load(open('/tmp/s-$tag/manifest.json'))['generated_at'])")
            HISTORY_DATE=$(date -u -d "$gen" +"%Y-%m-%d %H:%M") python3 tools/history_add.py signatures "$tag" "$tag" "3 Bloom filters" "$gen"
          done
          # Keep the table in date order (backfilled rows were added out of order).
          python3 - <<'PY'
          lines=open('HISTORY.md').read().splitlines()
          rows=sorted([l for l in lines if l.startswith('| 20')], reverse=True)
          head=[l for l in lines if not l.startswith('| 20')]
          open('HISTORY.md','w').write('\n'.join(head).rstrip()+'\n'+'\n'.join(rows)+'\n')
          PY
          git add HISTORY.md
          git commit -q -m "History: backfill older databases" && git push || echo "nothing to commit"
