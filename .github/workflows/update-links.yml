name: Update link database

# Rebuilds links/ (dangerous sites and links for the app's Link protection) from URLhaus (malware-filter mirror)
# and Phishing.Database every day and commits it when it changed. Same as tools/update_link_db.sh in the app repo.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build link database
        run: python3 tools/build_link_db.py links

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links
          # The manifest always carries a new timestamp; publish only when the lists themselves changed.
          if git diff --cached --quiet -- links/link-domains.bin links/link-urls.bin; then
            echo "Lists unchanged"; exit 0
          fi
          v=$(python3 -c "import json;print(json.load(open('links/links-manifest.json'))['version'])")
          git commit -m "Link database $v"
          # Dated copy as a release (not "latest": that one stays the signature database the app downloads).
          tag="links-$v"
          gen=$(python3 -c "import json;print(json.load(open('links/links-manifest.json'))['generated_at'])")
          n=$(python3 -c "import json;m=json.load(open('links/links-manifest.json'));print(f\"{m['domain_count']:,} sites, {m['url_count']:,} links\")")
          python3 tools/history_add.py links "$v" "$tag" "$n" "$gen"
          git add HISTORY.md && git commit -q -m "History: links $v"
          git push
          gh release create "$tag" links/link-domains.bin links/link-urls.bin links/links-manifest.json \
            --repo "$GITHUB_REPOSITORY" --title "Links $v" --notes "Link database $v (generated $gen): $n." --latest=false
